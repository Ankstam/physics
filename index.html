<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>物理公式沙盒</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f7f4ec;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Times New Roman", serif;
      overflow: hidden;
      user-select: none;
    }
    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* 右上角物理符号面板 */
    .symbol-palette {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #dcd9d0;
      border-radius: 8px;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(4, 34px);
      gap: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }
    .symbol-item {
      display: flex;
      align-items: center;
      justify-content: center;
      font-style: italic;
      font-size: 18px;
      height: 34px;
      cursor: pointer;
      border-radius: 4px;
      border: 1px solid transparent;
      transition: all 0.15s ease;
      color: #333;
    }
    .symbol-item:hover {
      background: #eae7de;
      border-color: #ccc;
    }
    .symbol-item:active {
      transform: scale(0.95);
    }

    /* 底部操作与公式状态栏 */
    .control-panel {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      border: 1px solid #d5d3ca;
      border-radius: 30px;
      padding: 8px 24px;
      font-size: 15px;
      display: flex;
      gap: 16px;
      align-items: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
    }
    .formula-tag {
      font-style: italic;
      font-weight: 600;
      color: #1a1a1a;
      letter-spacing: 0.5px;
    }
    .data-text {
      color: #666;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }
    .btn {
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid #bbb;
      background: #fdfdfd;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #eee;
    }
    .btn-run {
      background: #2563eb;
      color: #fff;
      border-color: #1d4ed8;
    }
    .btn-run:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>

<!-- 右上角符号盘 -->
<div class="symbol-palette">
  <div class="symbol-item" title="质量 (Mass)">m</div>
  <div class="symbol-item" title="天体质量">M</div>
  <div class="symbol-item" title="重力加速度">g</div>
  <div class="symbol-item" title="加速度">a</div>
  <div class="symbol-item" title="速度">v</div>
  <div class="symbol-item" title="半径/距离">r</div>
  <div class="symbol-item" title="系数">½</div>
  <div class="symbol-item" title="摩擦因数">μ</div>
  <div class="symbol-item" title="光速">c</div>
  <div class="symbol-item" title="万有引力常量">G</div>
  <div class="symbol-item" title="时间">t</div>
  <div class="symbol-item" title="磁感应强度">B</div>
  <div class="symbol-item" title="电场强度/能量">E</div>
  <div class="symbol-item" title="电荷量">q</div>
  <div class="symbol-item" title="电流">I</div>
</div>

<!-- 底部控制栏 -->
<div class="control-panel">
  <span class="formula-tag">y = ½ · g · t²</span>
  <span class="data-text" id="readout">t: 0.00 s | v: 0.0 m/s | y: 0.0 m</span>
  <button class="btn btn-run" id="btnLaunch">释放自由落体</button>
  <button class="btn" id="btnReset">重置</button>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const readout = document.getElementById('readout');
  const btnLaunch = document.getElementById('btnLaunch');
  const btnReset = document.getElementById('btnReset');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // 物理参数定义 (比例尺：1米 = 45像素)
  const SCALE = 45;
  const g = 9.8; 
  let t = 0;
  let isRunning = false;
  let lastTime = 0;

  const originX = 180;
  const originY = 120;
  const ball = { x: originX, y: originY, r: 16 };

  function drawVector(fromX, fromY, dx, dy, color, label) {
    if (Math.hypot(dx, dy) < 2) return;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 2.5;

    ctx.beginPath();
    ctx.moveTo(fromX, fromY);
    ctx.lineTo(fromX + dx, fromY + dy);
    ctx.stroke();

    const headLength = 9;
    const angle = Math.atan2(dy, dx);
    ctx.beginPath();
    ctx.moveTo(fromX + dx, fromY + dy);
    ctx.lineTo(fromX + dx - headLength * Math.cos(angle - Math.PI / 6), fromY + dy - headLength * Math.sin(angle - Math.PI / 6));
    ctx.lineTo(fromX + dx - headLength * Math.cos(angle + Math.PI / 6), fromY + dy - headLength * Math.sin(angle + Math.PI / 6));
    ctx.fill();

    ctx.font = 'italic 15px STIXGeneral, serif';
    ctx.fillText(label, fromX + dx + 8, fromY + dy + 4);
    ctx.restore();
  }

  function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    const groundY = canvas.height - 90;

    if (isRunning) {
      t += dt;
      const displacementY = 0.5 * g * (t ** 2);
      const currentPixelY = originY + displacementY * SCALE;

      if (currentPixelY >= groundY - ball.r) {
        ball.y = groundY - ball.r;
        isRunning = false;
        // 落地根据机械能守恒/运动学公式反算末速度
        const finalT = Math.sqrt((2 * (groundY - ball.r - originY)) / (g * SCALE));
        t = finalT;
      } else {
        ball.y = currentPixelY;
      }

      const currentVelocity = g * t;
      const currentHeight = (ball.y - originY) / SCALE;
      readout.innerText = `t: ${t.toFixed(2)} s | v: ${currentVelocity.toFixed(1)} m/s | y: ${currentHeight.toFixed(1)} m`;
    }

    // 画面清屏重绘
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 绘制地面
    ctx.strokeStyle = '#c5c2ba';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(60, groundY);
    ctx.lineTo(canvas.width - 60, groundY);
    ctx.stroke();

    // 绘制下落小球
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();

    // 绘制物理量动态矢量箭头
    const vY = g * t;
    drawVector(ball.x, ball.y, 0, 35, '#16a34a', 'g (9.8 m/s²)'); // 加速度矢量
    if (vY > 0) {
      drawVector(ball.x + ball.r + 6, ball.y, 0, vY * 2.8, '#dc2626', `v (${vY.toFixed(1)} m/s)`); // 速度矢量
    }

    requestAnimationFrame(loop);
  }

  btnLaunch.onclick = () => {
    t = 0;
    ball.y = originY;
    isRunning = true;
  };

  btnReset.onclick = () => {
    isRunning = false;
    t = 0;
    ball.y = originY;
    readout.innerText = 't: 0.00 s | v: 0.0 m/s | y: 0.0 m';
  };

  requestAnimationFrame(loop);
</script>
</body>
</html>
